<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robotics &amp; Mechatronics Notes &mdash; All Topics</title>
<meta name="description" content="Complete subject notes for Robotics and Mechatronics in simple language, one HTML file per topic, with SVG circuit diagrams, block diagrams, tables, summaries and review questions.">
<style>
/* ==========================================================================
   Robotics & Mechatronics Notes - shared stylesheet
   ========================================================================== */

:root{
  --bg:#f4f7fb;
  --panel:#ffffff;
  --ink:#1c2733;
  --ink-soft:#4a5b6d;
  --line:#dbe4ee;
  --brand:#0f5fa8;
  --brand-dark:#0a4377;
  --brand-soft:#e7f1fb;
  --accent:#e07b00;
  --accent-soft:#fff4e5;
  --good:#157a4b;
  --good-soft:#e8f6ee;
  --warn:#a8232a;
  --warn-soft:#fdecec;
  --radius:12px;
  --shadow:0 1px 2px rgba(16,42,67,.06), 0 6px 18px rgba(16,42,67,.06);
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  font-size:16.5px;
  line-height:1.78;
  -webkit-text-size-adjust:100%;
}

/* ---------- top bar ---------- */
.topbar{
  background:linear-gradient(120deg,var(--brand-dark),var(--brand) 60%,#1878c9);
  color:#fff;
  padding:14px 20px;
  position:sticky;top:0;z-index:50;
  box-shadow:0 2px 10px rgba(10,40,70,.25);
}
.topbar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brandmark{
  width:38px;height:38px;flex:0 0 38px;border-radius:10px;
  background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.28);
}
.brandmark svg{display:block}
.topbar h1{font-size:17px;margin:0;letter-spacing:.2px;font-weight:650}
.topbar .sub{font-size:12.5px;opacity:.86;margin:1px 0 0}
.topbar .spacer{flex:1 1 auto}
.topnav{display:flex;gap:8px;flex-wrap:wrap}
.topnav a{
  color:#fff;text-decoration:none;font-size:13.5px;
  padding:6px 12px;border-radius:999px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
  transition:background .18s;
}
.topnav a:hover{background:rgba(255,255,255,.3)}

/* ---------- layout ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:26px 20px 70px}
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);
  padding:26px 28px;margin-bottom:22px;
}

/* ---------- breadcrumb + heading ---------- */
.crumbs{font-size:13.5px;color:var(--ink-soft);margin:0 0 10px}
.crumbs a{color:var(--brand);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.unit-tag{
  display:inline-block;font-size:12px;font-weight:700;letter-spacing:.9px;
  text-transform:uppercase;color:var(--brand-dark);background:var(--brand-soft);
  border:1px solid #cfe2f5;padding:4px 11px;border-radius:999px;margin-bottom:12px;
}
h2.page-title{
  font-size:30px;line-height:1.28;margin:0 0 8px;color:#12283d;font-weight:700;
  letter-spacing:-.2px;
}
.topic-no{color:var(--accent);font-weight:700;margin-right:8px}
.lede{font-size:17px;color:var(--ink-soft);margin:0 0 20px;max-width:78ch}

h3{
  font-size:21px;margin:34px 0 12px;color:#123252;font-weight:680;
  padding-bottom:7px;border-bottom:2px solid var(--line);
  scroll-margin-top:88px;
}
h3 .sec-no{color:var(--brand);margin-right:9px;font-family:var(--mono);font-size:17px}
h4{font-size:17px;margin:22px 0 8px;color:#173a5c;font-weight:660}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-left:24px}
li{margin-bottom:7px}
li::marker{color:var(--brand)}
strong{color:#12283d;font-weight:660}
a{color:var(--brand)}
code{
  font-family:var(--mono);font-size:.9em;background:#eef3f9;
  border:1px solid #dfe8f2;padding:1px 5px;border-radius:5px;color:#0d3f6d;
}

/* ---------- table of contents ---------- */
.toc{
  background:var(--brand-soft);border:1px solid #cfe2f5;border-radius:10px;
  padding:16px 20px;margin:0 0 26px;
}
.toc h4{margin:0 0 8px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--brand-dark)}
.toc ol{margin:0;padding-left:22px;columns:2;column-gap:34px}
.toc li{font-size:14.5px;margin-bottom:4px;break-inside:avoid}
.toc a{text-decoration:none}
.toc a:hover{text-decoration:underline}

/* ---------- callouts ---------- */
.note,.formula,.example,.warn,.defbox{
  border-radius:10px;padding:14px 18px;margin:18px 0;border:1px solid;font-size:15.5px;
}
.note{background:var(--brand-soft);border-color:#cfe2f5}
.example{background:var(--good-soft);border-color:#cde9d9}
.warn{background:var(--warn-soft);border-color:#f4d3d5}
.formula{background:#fbf8f1;border-color:#ece0c6}
.defbox{background:#f6f7f9;border-color:var(--line)}
.note b,.example b,.warn b,.formula b,.defbox b{display:inline-block;margin-bottom:3px}
.note .tag,.example .tag,.warn .tag,.formula .tag{
  display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;padding:2px 9px;border-radius:5px;margin-bottom:7px;
}
.note .tag{background:var(--brand);color:#fff}
.example .tag{background:var(--good);color:#fff}
.warn .tag{background:var(--warn);color:#fff}
.formula .tag{background:var(--accent);color:#fff}
.formula p:last-child{margin-bottom:0}
.eq{
  font-family:var(--mono);font-size:16px;background:#fff;border:1px dashed #dccfae;
  border-radius:7px;padding:9px 14px;margin:9px 0;display:block;overflow-x:auto;
}
.note ul,.example ul,.warn ul,.defbox ul{margin-bottom:6px}
.note p:last-child,.example p:last-child,.warn p:last-child{margin-bottom:0}

/* ---------- tables ---------- */
.tbl-scroll{overflow-x:auto;margin:16px 0 20px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15px;background:#fff}
caption{
  caption-side:top;text-align:left;font-size:13.5px;font-weight:700;color:var(--brand-dark);
  padding:10px 14px;background:var(--brand-soft);border-bottom:1px solid var(--line);
}
th,td{border:1px solid var(--line);padding:9px 13px;text-align:left;vertical-align:top}
thead th{background:#eef4fa;color:#12324f;font-weight:680;white-space:nowrap}
tbody tr:nth-child(even){background:#fafcfe}
tbody tr:hover{background:var(--brand-soft)}
td.num,th.num{text-align:right;font-family:var(--mono);font-size:14px;white-space:nowrap}

/* ---------- figures ---------- */
figure.fig{
  margin:22px 0;padding:18px 16px 12px;background:#fff;
  border:1px solid var(--line);border-radius:10px;text-align:center;
}
figure.fig .svgbox{width:100%;overflow-x:auto}
figure.fig svg{max-width:100%;height:auto;display:inline-block}
figcaption{
  font-size:13.8px;color:var(--ink-soft);margin-top:12px;padding-top:10px;
  border-top:1px solid var(--line);text-align:left;
}
figcaption b{color:var(--brand-dark)}

/* ---------- key points / summary ---------- */
.summary{background:linear-gradient(180deg,#f7fbff,#eef5fc);border:1px solid #cfe2f5}
.summary h3{border-bottom-color:#cfe2f5;margin-top:6px}
.kp{list-style:none;padding:0;margin:0}
.kp li{
  position:relative;padding:6px 0 6px 26px;margin:0;border-bottom:1px dashed #d6e4f1;
}
.kp li:last-child{border-bottom:0}
.kp li::before{
  content:"\2713";position:absolute;left:0;top:6px;color:var(--good);
  font-weight:700;font-size:15px;
}
.qa{counter-reset:q;list-style:none;padding:0;margin:0}
.qa li{
  counter-increment:q;position:relative;padding:8px 0 8px 32px;margin:0;
  border-bottom:1px dashed var(--line);
}
.qa li:last-child{border-bottom:0}
.qa li::before{
  content:"Q" counter(q);position:absolute;left:0;top:9px;
  font-family:var(--mono);font-size:11.5px;font-weight:700;color:#fff;
  background:var(--brand);border-radius:5px;padding:1px 5px;
}

/* ---------- pager ---------- */
.pager{display:flex;gap:14px;margin:26px 0 0;flex-wrap:wrap}
.pager a{
  flex:1 1 260px;text-decoration:none;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:13px 16px;box-shadow:var(--shadow);transition:.18s;
}
.pager a:hover{border-color:var(--brand);transform:translateY(-2px)}
.pager .dir{font-size:11.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-soft);display:block}
.pager .ttl{font-size:15px;color:var(--brand-dark);font-weight:640;display:block;margin-top:3px}
.pager a.next{text-align:right}

/* ---------- footer ---------- */
footer.site{
  text-align:center;font-size:13px;color:var(--ink-soft);
  padding:20px;border-top:1px solid var(--line);margin-top:10px;
}

/* ---------- back to top ---------- */
#toTop{
  position:fixed;right:22px;bottom:22px;width:46px;height:46px;border-radius:50%;
  background:var(--brand);color:#fff;border:0;cursor:pointer;font-size:20px;
  box-shadow:0 4px 14px rgba(10,60,110,.35);opacity:0;visibility:hidden;
  transition:opacity .25s,transform .25s;transform:translateY(10px);z-index:60;
}
#toTop.show{opacity:1;visibility:visible;transform:translateY(0)}
#toTop:hover{background:var(--brand-dark)}

/* ---------- progress bar ---------- */
#progress{
  position:fixed;top:0;left:0;height:3px;width:0;z-index:80;
  background:linear-gradient(90deg,var(--accent),#ffc061);
}

/* ---------- index page specifics ---------- */
.hero{
  background:linear-gradient(125deg,#0a4377,#0f5fa8 55%,#1a86d6);
  color:#fff;border-radius:var(--radius);padding:34px 32px;margin-bottom:24px;
  box-shadow:var(--shadow);
}
.hero h2{margin:0 0 10px;font-size:32px;line-height:1.25;border:0;color:#fff}
.hero p{margin:0 0 6px;opacity:.93;max-width:80ch}
.hero .stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:20px}
.hero .stat{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:10px 16px}
.hero .stat b{display:block;font-size:22px;line-height:1.2}
.hero .stat span{font-size:12.5px;opacity:.9}
.unit-head{
  background:#12324f;color:#fff;border-radius:9px;padding:11px 16px;
  font-size:16.5px;font-weight:650;margin:0 0 4px;
}
.unit-head small{display:block;font-weight:400;font-size:13px;opacity:.85;margin-top:2px}
td.tno{font-family:var(--mono);font-weight:700;color:var(--accent);white-space:nowrap;font-size:14px}
td a.topic-link{text-decoration:none;font-weight:640;color:var(--brand-dark)}
td a.topic-link:hover{text-decoration:underline;color:var(--brand)}
.chip{
  display:inline-block;font-size:11.5px;background:#eef3f9;border:1px solid #dce6f1;
  color:#3a5a78;border-radius:999px;padding:1px 8px;margin:1px 2px 1px 0;white-space:nowrap;
}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:18px 0}
.quick a{
  display:block;text-decoration:none;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);transition:.18s;
}
.quick a:hover{border-color:var(--brand);transform:translateY(-2px)}
.quick b{display:block;font-size:14.5px;color:var(--brand-dark)}
.quick span{font-size:12.8px;color:var(--ink-soft)}

/* ---------- svg diagram shared classes ---------- */
svg text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
svg .t-box{fill:#fff;stroke:#0f5fa8;stroke-width:1.6}
svg .t-box2{fill:#e7f1fb;stroke:#0f5fa8;stroke-width:1.6}
svg .t-box3{fill:#fff4e5;stroke:#e07b00;stroke-width:1.6}
svg .t-box4{fill:#e8f6ee;stroke:#157a4b;stroke-width:1.6}
svg .t-box5{fill:#fdecec;stroke:#a8232a;stroke-width:1.6}
svg .t-lbl{font-size:13px;fill:#12283d;text-anchor:middle;dominant-baseline:middle;font-weight:600}
svg .t-lbl-s{font-size:11px;fill:#4a5b6d;text-anchor:middle;dominant-baseline:middle}
svg .t-lbl-w{font-size:13px;fill:#fff;text-anchor:middle;dominant-baseline:middle;font-weight:600}
svg .t-cap{font-size:11.5px;fill:#5b6b7c;text-anchor:middle}
svg .lnk{stroke:#33556f;stroke-width:1.7;fill:none}
svg .lnk-d{stroke:#8aa2b8;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
svg .arw{fill:#33556f}
svg .arw-o{fill:#e07b00}
svg .wire{stroke:#12283d;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg .wire-r{stroke:#a8232a;stroke-width:1.8;fill:none}
svg .wire-b{stroke:#0f5fa8;stroke-width:1.8;fill:none}
svg .cmp{stroke:#12283d;stroke-width:1.8;fill:none;stroke-linecap:round}
svg .cmp-f{fill:#e7f1fb;stroke:#12283d;stroke-width:1.8}
svg .cmp-y{fill:#fff4e5;stroke:#12283d;stroke-width:1.8}
svg .cmp-g{fill:#e8f6ee;stroke:#12283d;stroke-width:1.8}
svg .dot{fill:#12283d}
svg .ax{stroke:#8aa2b8;stroke-width:1.2;fill:none}
svg .ax-lbl{font-size:11px;fill:#5b6b7c}
svg .grid{stroke:#eef2f7;stroke-width:1}
svg .mech{fill:#dfe8f1;stroke:#4a5b6d;stroke-width:1.6}
svg .mech2{fill:#f2d9b8;stroke:#8a5a1c;stroke-width:1.6}
svg .mech3{fill:#cfe6d6;stroke:#2c6a48;stroke-width:1.6}
svg .hatch{fill:url(#hatchpat);stroke:#4a5b6d;stroke-width:1.2}

/* ---------- responsive ---------- */
@media (max-width:720px){
  body{font-size:16px}
  .card{padding:20px 16px}
  h2.page-title{font-size:24px}
  .toc ol{columns:1}
  .wrap{padding:18px 12px 60px}
  .hero{padding:24px 20px}
  .hero h2{font-size:25px}
  .pager a{flex:1 1 100%}
}

/* ---------- print ---------- */
@media print{
  .topbar,#toTop,#progress,.pager{display:none !important}
  body{background:#fff;font-size:12pt}
  .card{box-shadow:none;border:0;padding:0}
  figure.fig{break-inside:avoid;border:1px solid #ccc}
  h3{break-after:avoid}
  a{color:#000;text-decoration:none}
}

</style>
</head>
<body>
<div id="progress"></div>
<header class="topbar">
  <div class="topbar-in">
    <div class="brandmark">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="8" width="16" height="11" rx="2.5"/>
        <path d="M12 8V4"/><circle cx="12" cy="3" r="1.4"/>
        <circle cx="9" cy="13" r="1.3" fill="#fff"/><circle cx="15" cy="13" r="1.3" fill="#fff"/>
        <path d="M9.5 16.5h5"/>
      </svg>
    </div>
    <div>
      <h1>Robotics &amp; Mechatronics</h1>
      <p class="sub">Subject Notes &middot; 29 topics &middot; 4 units &middot; offline HTML</p>
    </div>
    <div class="spacer"></div>
    <nav class="topnav">
      <a href="#uniti">Unit I</a>
      <a href="#unitii">Unit II</a>
      <a href="#unitiii">Unit III</a>
      <a href="#unitiv">Unit IV</a>
      <a href="javascript:window.print()">Print</a>
    </nav>
  </div>
</header>
<main class="wrap">
</main>
<footer class="site">
  Robotics &amp; Mechatronics &mdash; Study Notes &middot; Every page is a single self-contained HTML file &middot; Diagrams drawn in inline SVG
</footer>
<button id="toTop" title="Back to top" aria-label="Back to top">&uarr;</button>
<script>
(function(){
  var btn=document.getElementById('toTop');
  var bar=document.getElementById('progress');
  function onScroll(){
    var y=window.pageYOffset||document.documentElement.scrollTop;
    if(y>420){btn.classList.add('show');}else{btn.classList.remove('show');}
    var h=document.documentElement.scrollHeight-window.innerHeight;
    if(bar){bar.style.width=(h>0?(y/h*100):0)+'%';}
  }
  window.addEventListener('scroll',onScroll,{passive:true});
  btn.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});
  onScroll();
})();
</script>
</body>
</html>
